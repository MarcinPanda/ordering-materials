<style>

/* VOICE: plain, exact warehouse tool; no decoration that slows counting
   IDEA: the count sheet on a clipboard — yellow fields are where the pen goes
   PICTURE: the count list itself, big yellow inputs, status tags like shelf labels
   COLOUR and TYPE: safety yellow #ffd21f, ink #16181d, white ground; Barlow Condensed signage + Barlow
   LAYOUT: top strip with counts, tabs, the working list, sticky save bar */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121418);--ink:light-dark(#16181d,#eceef2);--mut:light-dark(#5d6470,#9aa1ad);--line:light-dark(#e3e5ea,#2a2e36);--zone:light-dark(#f4f5f7,#1b1e24);--y:#ffd21f;--yfield:light-dark(#fff6cc,#3a3214);--yedge:light-dark(#e8c200,#8a7413);--red:light-dark(#c62828,#ff7a70);--org:light-dark(#b85c00,#ffb15c);--grn:light-dark(#1d7a45,#5fd393);--blu:light-dark(#2a55c9,#8fb0ff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,.big{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;line-height:1.05}
h1{font-size:clamp(28px,4vw,40px);margin:0}
h2{font-size:24px;margin:0 0 12px}
button,input,select{font:inherit;color:inherit}
button{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--zone);cursor:pointer;font-weight:600}
button:hover{border-color:var(--mut)}
button.pri{background:var(--y);border-color:var(--yedge);color:#16181d}
button.ghost{background:none;border-color:transparent}
button.sm{min-height:36px;padding:0 10px;font-size:14px}
:focus-visible{outline:3px solid var(--blu);outline-offset:2px}
input,select{min-height:44px;font-size:16px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
a{color:var(--blu)}
.top{background:#16181d;color:#fff;padding:20px max(4vw,16px) 0}
.top .row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.top small{color:#b9bec8;display:block;margin-top:4px}
.kpis{display:flex;flex-wrap:wrap;gap:8px}
.kpi{background:#23262d;border-radius:10px;padding:8px 14px;min-width:96px}
.kpi b{font:700 28px/1 "Barlow Condensed",sans-serif;display:block}
.kpi span{font-size:13px;color:#b9bec8}
.kpi.warn b{color:#ffb15c}.kpi.bad b{color:#ff7a70}.kpi.y b{color:var(--y)}
.tabs{display:flex;gap:4px;margin-top:18px;overflow-x:auto}
.tabs button{border:0;border-radius:8px 8px 0 0;background:transparent;color:#c9ced6;flex:none}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--ink)}
main{padding:20px max(4vw,16px) 120px;max-width:1300px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar input[type=search]{flex:1 1 220px}
.note{font-size:14px;color:var(--mut)}
table{width:100%;border-collapse:collapse}
th{font-size:13px;color:var(--mut);font-weight:600;text-align:left;padding:8px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.chg td{background:light-dark(#fffbe8,#221e0d)}
.nm{font-weight:600}.art{font-size:13px;color:var(--mut)}
.cnt{width:110px;text-align:right;background:var(--yfield);border:2px solid var(--yedge);font-weight:600;font-variant-numeric:tabular-nums}
.cnt::placeholder{color:var(--mut);font-weight:400}
.diff{font-size:13px;margin-left:6px;white-space:nowrap}
.diff.up{color:var(--grn)}.diff.dn{color:var(--red)}
.tag{display:inline-block;font:700 13px/1 Barlow,sans-serif;padding:6px 8px;border-radius:4px;white-space:nowrap;border:1.5px solid currentColor}
.t-ok{color:var(--grn)}.t-order{color:var(--org)}.t-out{color:var(--red)}.t-count{color:var(--blu)}.t-data{color:var(--mut)}
.save{position:fixed;left:0;right:0;bottom:0;background:#16181d;color:#fff;padding:12px max(4vw,16px);display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;z-index:5;box-shadow:0 -6px 20px rgba(0,0,0,.2)}
.save[hidden]{display:none}
.save .ghost{color:#fff}
.sup{border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
.sup header{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;background:var(--zone);padding:10px 14px}
.sup header b{font:700 20px "Barlow Condensed",sans-serif}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.field label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.field input{width:100%}
.dlg{position:fixed;inset:0;background:rgba(10,12,16,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.dlg[hidden]{display:none}
.card{background:var(--bg);border-radius:14px;padding:22px;width:min(720px,100%);max-height:92vh;overflow:auto}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px}
.acts .del{margin-right:auto;color:var(--red)}
.miss{display:inline-block;font-size:13px;background:var(--zone);border-radius:4px;padding:2px 8px;margin:2px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;font-weight:600;max-width:90vw}
.toast[hidden]{display:none}
.empty{padding:32px;text-align:center;color:var(--mut)}
details{border-bottom:1px solid var(--line);padding:10px 0}
summary{cursor:pointer;font-weight:600}
.set{display:flex;gap:16px;flex-wrap:wrap;background:var(--zone);padding:12px 14px;border-radius:12px;margin-bottom:16px;align-items:flex-end}
.set .field input{width:110px}
.scroll{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){tr.chg td{transition:background .3s}}
@media(max-width:700px){
 table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}
 .stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8.5em;text-align:start}
 .stack td::before{content:attr(data-l);float:inline-start;width:8em;margin-inline-start:-8.5em;color:var(--mut);font-size:13px}
 .stack td:empty{display:none}.stack td.n{text-align:start}
 .stack td.first{padding-inline-start:0}.stack td.first::before{display:none}
}

th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--ink)}
.nmrow{display:flex;align-items:center;gap:6px}.wait{display:inline-flex;color:light-dark(#a67c00,#ffd21f);cursor:help;flex-shrink:0;border-radius:50%;outline-offset:2px}
#tip{position:fixed;z-index:60;background:#16181d;color:#fff;font-size:13px;padding:6px 10px;border-radius:8px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.35);white-space:nowrap}

<div id="app"><div class="empty">Loading…</div></div>
<div class="dlg" id="dlg" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
/* WEB / PHONE VERSION — replaces the local Python server with the shared Firebase database.
   The app talks to /api/* as before; this shim answers those calls from Firestore. */
window.__TEST__=true;   /* = "no local server": links open natively, no close beacon */
window.__WEB__=true;
(()=>{
  const SEED={"data": {"v": 1, "items": [], "history": [], "requests": [], "settings": {}}, "rev": "1"};
  let fb=null;                                   /* filled by the Firebase module below */
  const fbReady=new Promise(r=>{window.__fbResolve=v=>{fb=v;r(v)}});
  let authed=null, authedResolve, authedDone=false;
  /* a new promise only after a completed sign-in was lost, so calls already waiting are never orphaned */
  const resetAuthed=()=>{if(authed&&!authedDone)return;authedDone=false;authed=new Promise(r=>authedResolve=v=>{authedDone=true;r(v)})};resetAuthed();
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  /* copy of the last data on this device: the app opens instantly from it and then refreshes from the cloud */
  const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
  const saveCache=(data,rev)=>LS.set('om-cache',JSON.stringify({data,rev:String(rev)}));
  let fastUsed=false;
  const J=(o,st=200)=>new Response(JSON.stringify(o),{status:st,headers:{'Content-Type':'application/json'}});

  /* ---- sign-in with the shared access code ---- */
  function loginBox(msg){
    let box=document.getElementById('om-login');
    if(!box){box=document.createElement('div');box.id='om-login';box.className='dlg';box.style.zIndex=50;document.body.appendChild(box)}
    box.innerHTML=`<form class="card" style="width:min(420px,100%)"><h2 style="display:flex;align-items:center;gap:10px"><img src="icon-192.png" width="40" height="40" alt="" style="border-radius:9px">Ordering Materials</h2>
      <p class="small" style="margin-top:0">Enter the access code once on this device.</p>
      <input class="pin" id="om-code" type="password" autocomplete="current-password" aria-label="Access code" style="letter-spacing:.15em">
      ${msg?`<p style="color:var(--red);font-weight:600;margin:10px 0 0">${esc(msg)}</p>`:''}
      <div class="acts"><button class="pri" type="submit" style="flex:1">Sign in</button></div></form>`;
    box.hidden=false;const inp=box.querySelector('#om-code');setTimeout(()=>inp.focus(),50);
    box.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=box.querySelector('button');b.disabled=true;b.textContent='Signing in…';
      try{await fb.signIn(inp.value.trim())}catch(err){const c=String(err&&err.code||'');loginBox(/network/.test(c)?'No internet connection — try again.':/too-many/.test(c)?'Too many attempts — wait a moment and try again.':'Wrong access code.')}};
  }
  fbReady.then(f=>f.onAuth(u=>{
    if(u){LS.set('om-in','1');const box=document.getElementById('om-login');if(box)box.remove();authedResolve(u)}
    else{LS.set('om-in',null);LS.set('om-cache',null);resetAuthed();if(document.readyState==='loading')addEventListener('DOMContentLoaded',()=>loginBox());else loginBox()}
  }));
  window.__omSignOut=async()=>{await fbReady;await fb.signOut()};
  window.__omPush=async()=>{await fbReady;await authed;return fb.push};

  /* ---- live updates from other devices ---- */
  let lastRev=null;
  authed.then(()=>fb.watch(snap=>{if(!snap.exists())return;const d=snap.data(),r=String(d.rev);saveCache(d.data,r);if(lastRev!==null&&r!==lastRev){lastRev=r;dispatchEvent(new Event('om-remote'))}else lastRev=r}));

  async function current(){
    await fbReady;await authed;
    const snap=await fb.get();
    if(snap.exists()){const d=snap.data();lastRev=String(d.rev);saveCache(d.data,d.rev);return{data:d.data,rev:String(d.rev)}}
    /* very first start: put today's data into the empty cloud database */
    await fb.tx(async t=>{const s=await t.get(fb.ref);if(!s.exists())t.set(fb.ref,{data:SEED.data,rev:String(SEED.rev),savedAt:new Date().toISOString(),seeded:true})});
    const s2=await fb.get();const d=s2.data();lastRev=String(d.rev);return{data:d.data,rev:String(d.rev)};
  }
  function openUrl(url){
    if(url.startsWith('msteams:'))url='https://teams.microsoft.com'+url.slice('msteams:'.length);  /* phones and browsers: Teams web link opens the Teams app */
    if(url.startsWith('mailto:')||url.startsWith('https://teams.microsoft.com/')){location.href=url;return}
    window.open(url,'_blank','noopener');
  }
  const real=window.fetch.bind(window);
  window.fetch=async(url,opt={})=>{
    const u=String(url);if(!u.startsWith('/api/'))return real(url,opt);
    if(u==='/api/ping')return J({ok:true});
    if(u==='/api/whoami')return J({user:(()=>{try{return localStorage.getItem('om-device-name')||''}catch(e){return''}})()});
    let b={};try{b=JSON.parse(opt.body||'{}')}catch(e){}
    if(u==='/api/open'){openUrl(String(b.url||''));return J({ok:true})}
    try{
      if(u==='/api/data'){
        if(!fastUsed){fastUsed=true;const raw=LS.get('om-cache');
          if(raw&&LS.get('om-in')==='1'){try{const c=JSON.parse(raw);if(c&&c.data&&c.rev){lastRev=c.rev;
            /* refresh in the background: if the cloud has newer data, the app reloads it quietly */
            current().then(n=>{if(n.rev!==c.rev)dispatchEvent(new Event('om-remote'))}).catch(()=>{});
            return J({data:c.data,rev:c.rev,file:'Shared cloud database'})}}catch(e){}}}
        const c=await current();return J({data:c.data,rev:c.rev,file:'Shared cloud database'})}
      if(u==='/api/save'){
        await fbReady;await authed;
        let conflict=null,newRev=null;
        await fb.tx(async t=>{const s=await t.get(fb.ref);const cur=s.exists()?String(s.data().rev):'0';
          if(cur!==String(b.rev)){conflict={data:s.exists()?s.data().data:null,rev:cur};return}
          newRev=String(+cur+1);t.set(fb.ref,{data:b.data,rev:newRev,savedAt:new Date().toISOString()})});
        if(conflict)return J({conflict:true,...conflict},409);
        lastRev=newRev;saveCache(b.data,newRev);return J({ok:true,rev:newRev});
      }
    }catch(e){const c=String(e&&(e.code||e.message)||e);return J({error:/unavailable|network|offline/i.test(c)?'No connection to the database — check your internet and try again.':'Database error: '+c},500)}
    return J({error:'unknown'},404);
  };
})();

</script>

/* messaging is loaded only when notifications are used, so the app starts faster */
const MSG=()=>import("https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js");

const firebaseConfig={
  apiKey:"AIzaSyAazUAY-zCyOUlbVNrGV81ntlGCvrRvrus",
  authDomain:"ordering-materials.firebaseapp.com",
  projectId:"ordering-materials",
  storageBucket:"ordering-materials.firebasestorage.app",

};
const APP_ACCOUNT="om.app@nabuurs.nl";   /* the shared app account; the access code is its password */
const VAPID_KEY="BBFG_wxNCtbDnIURLQEzR49vz6iKfAfJiLO76C7rF5ALHKXx2GdMJSFceU6TtUn8_GG1yNXPUS6qU5k2v-Ec_8Q";              /* Firebase → Cloud Messaging → Web Push certificate (public) */
const PUSH_URL="https://om-push.marcin-klubben12.workers.dev";            /* Cloudflare Worker that sends the notifications */

const app=initializeApp(firebaseConfig);

setPersistence(auth,browserLocalPersistence).catch(()=>{});

try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}
catch(e){db=initializeFirestore(app,{})}
const ref=doc(db,"om","state");

window.__fbResolve({

  push:{
    configured:()=>!!(VAPID_KEY&&!VAPID_KEY.startsWith("__")&&PUSH_URL&&!PUSH_URL.startsWith("__")),
    supported:async()=>{try{const {isSupported}=await MSG();return await isSupported()&&"Notification" in window&&"serviceWorker" in navigator}catch(e){return false}},
    deviceId:()=>{let id=null;try{id=localStorage.getItem("om-device-id");if(!id){id="d"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);localStorage.setItem("om-device-id",id)}}catch(e){id="d-temp"}return id},
    /* turn on: permission → FCM token → listed in om/push for the given topics */
    async enable(topics,name){
      const perm=await Notification.requestPermission();
      if(perm!=="granted")throw new Error(perm==="denied"?"blocked":"dismissed");
      await navigator.serviceWorker.register("sw.js");const reg=await Promise.race([navigator.serviceWorker.ready,new Promise((_,j)=>setTimeout(()=>j(new Error("app service worker did not start — reload the app and try again")),15000))]);
      const {getMessaging,getToken}=await MSG();const token=await getToken(getMessaging(app),{vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});
      const id=this.deviceId();
      await setDoc(pushRef,{devices:{[id]:{token,topics,name:name||"",at:new Date().toISOString()}}},{merge:true});
      return id;
    },
    async disable(){
      const id=this.deviceId();
      try{const {getMessaging,deleteToken}=await MSG();await deleteToken(getMessaging(app))}catch(e){}
      await setDoc(pushRef,{devices:{[id]:deleteField()}},{merge:true});
    },
    async state(){
      const s=await getDoc(pushRef);const d=s.exists()?(s.data().devices||{})[this.deviceId()]:null;
      return {on:!!d&&("Notification" in window)&&Notification.permission==="granted",topics:d?d.topics||[]:[],name:d?d.name||"":""};
    },
    /* ask the relay to notify everyone subscribed to a topic (except this device) */
    async notify(topic,title,body,link,includeSelf){
      const u=auth.currentUser;if(!u||!this.configured())return;
      const t=await u.getIdToken();
      return fetch(PUSH_URL,{method:"POST",keepalive:true,headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify({topic,title,body,link,exclude:includeSelf?"":this.deviceId()})}).then(r=>r.json()).catch(()=>null);
    }
  }
});

<script>
{
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(v==null)return null;const s=String(v).trim().replace(',','.');if(s==='')return null;const n=Number(s);return isFinite(n)?n:NaN};
const fmt=n=>n==null||n===''?'':(Math.round(n*100)/100).toLocaleString('en-GB');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fdate=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';
const clone=o=>JSON.parse(JSON.stringify(o));
const LS=k=>'magazyn-eksp-'+k;
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(LS(k)))}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(LS(k)):localStorage.setItem(LS(k),JSON.stringify(v))}catch(e){}};
const EMAIL=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

let S=null, REV=null, FILE='', loadErr='';
let mode='req', unlocked=false;
let tab='count';
let draft=lsGet('draft')||{};
let basket=lsGet('basket')||[];      // [{id|null,name,art,unit,qty}]
let note='', sent=null, rq='', reqFor=lsGet('reqFor')||'', ME='';
let ordFilt='open', sel=new Set();
let q='', filt='all', sortBy='name', sortDir=1;

function toast(t,ms=3800){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,ms)}
function defaults(s){{const NL={zak:'bag',zakken:'bag',doos:'box',dozen:'box',stuks:'pcs',stuk:'pcs',rol:'roll',rollen:'roll',pak:'pack',pallets:'pallet'};(s.items||[]).forEach(i=>{const u=(i.unit||'').trim().toLowerCase();if(NL[u])i.unit=NL[u]});(s.requests||[]).forEach(r=>(r.lines||[]).forEach(l=>{const u=(l.unit||'').trim().toLowerCase();if(NL[u])l.unit=NL[u]}))}s.requests=s.requests||[];if(!(s.settings||{}).fix3){(s.items||[]).forEach(i=>{if(i.art==='1196735'&&(!i.link||i.link==='https://www.vikingdirect.nl/nl/'||i.link==='https://www.vikingdirect.nl/nl/viking-multifunctionele-doekjes-100-stuks-p-1196735'))i.link='https://www.vikingdirect.nl/nl/viking-multifunctionele-doekjes-100-stuks-p-1196735?queryID=7cb1c4e4cbeb3f9742557da2efa0d97a'});s.settings=s.settings||{};s.settings.fix3=true}if(!(s.settings||{}).fix1){(s.items||[]).forEach(i=>{if(i.id==='i12'&&i.unit==='box'&&i.pack===40)i.pack=null});s.settings=s.settings||{};s.settings.fix1=true}(s.items||[]).forEach(i=>{delete i.usage;delete i.lead});if(s.settings){delete s.settings.safety;delete s.settings.cycle}s.settings=Object.assign({recipient:'',deputy:'',deputyOn:false,channel:'teams',pinHash:''},s.settings||{});s.history=s.history||[];return s}

async function load(quiet){
  try{const r=await fetch('/api/data',{cache:'no-store'});const j=await r.json();
    if(!r.ok)throw new Error(j.error||r.status);
    FILE=j.file;if(j.rev!==REV){S=defaults(j.data);REV=j.rev;if(!quiet||!$('#dlg').hidden===false)safeRender()}
    loadErr='';

async function post(data){const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rev:REV,data})});const j=await r.json();return{status:r.status,j}}
/* Data change: applies fn to a copy and saves; if the file changed meanwhile, reloads the latest version and applies fn again. */
async function mutate(fn,msg){
  for(let a=0;a<2;a++){
    const next=clone(S);fn(next);next.savedAt=new Date().toISOString();
    let res;try{res=await post(next)}catch(e){toast('Could not save — check access to the network drive.');return false}
    if(res.status===200){S=next;REV=res.j.rev;render();if(msg)toast(msg);return true}
    if(res.status===409){S=defaults(res.j.data);REV=res.j.rev;continue}
    toast(res.j.error||'Save failed');return false;
  }
  render();toast('The file is being changed on another computer — try again in a moment.');return false;
}

/* ---------- stock logic ---------- */
function stockOf(it){return it.id in draft?num(draft[it.id]):it.stock}
function calc(it,s=stockOf(it)){
  /* Status from the physical count only. */
  if(s==null||isNaN(s))return{k:'count',t:'To count'};
  if(s<=0)return{k:'out',t:'Out of stock'};
  return{k:'ok',t:'In stock'};

async function fillPush(){
  const box=$('#pushbox');if(!box||!window.__omPush)return;
  let p;try{p=await window.__omPush()}catch(e){box.innerHTML='<p class="small">Not available.</p>';return}
  if(!p.configured()){box.innerHTML='<p class="small">Push notifications are not set up yet.</p>';return}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent), standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  if(!(await p.supported())){box.innerHTML=`<p class="small">${ios&&!standalone?'On iPhone, first add this app to the Home Screen (Share → Add to Home Screen), open it from there and come back here.':'This browser cannot receive notifications.'}</p>`;return}
  const st=await p.state().catch(()=>({on:false}));
  if(!$('#pushbox'))return;
  $('#pushbox').innerHTML=st.on
    ?`<p style="margin-top:0">✓ This device gets a notification for every <b>new request</b>.</p><div class="sendrow"><button data-act="pushtest">Send test notification</button><button data-act="pushoff">Turn off</button></div>`

}
function notifyNewRequest(req){
  if(!window.__omPush)return Promise.resolve();
  const names=req.lines.map(l=>l.name.replace(/\s*\(.*\)$/,''));
  return window.__omPush().then(p=>p.notify('requests','New request · '+(req.for||'—'),names.slice(0,4).join(', ')+(names.length>4?' +'+(names.length-4)+' more':'')+(req.note?' — '+req.note:''),'./')).catch(()=>{});
}

/* ---------- staff mode: request ---------- */
function vReq(){
  const ql=rq.toLowerCase(), inB=new Set(basket.map(b=>b.id));
  const rows=S.items.filter(i=>!ql||(i.name+' '+i.art+' '+i.loc).toLowerCase().includes(ql)).sort((a,b)=>a.name.localeCompare(b.name,'pl'));
  const to=recipient(), st=S.settings;
  const right=sent?`<div class="done"><b>Request saved — the message window is open</b><p>${sent.via==='mail'?'Check the email in Outlook and click “Send”.':'Go to the Teams window and press Enter to send.'}</p><p class="small">If nothing opened, try the other option below.</p>
     <div class="sendrow"><button data-act="send" data-via="${sent.via==='mail'?'teams':'mail'}">${sent.via==='mail'?'Send via Teams':'Send by email'}</button><button class="pri" data-act="newreq">New request</button></div></div>`
  :`<h2>To order</h2>
    ${basket.length?basket.map((b,ix)=>`<div class="bi"><div><div class="nm">${esc(b.name)}</div>${b.art?`<div class="art">${esc(b.art)}</div>`:''}</div><button class="sm ghost" data-brm="${ix}" aria-label="Remove">✕</button></div>`).join(''):'<p class="note">Click “Add” next to each item that needs to be ordered. The person who orders decides the quantity.</p>'}
    <div class="field" style="margin-top:12px"><label for="note">Notes (optional)</label><textarea id="note" placeholder="e.g. urgent, only 2 rolls left">${esc(note)}</textarea></div>
    <div class="field" style="margin-top:12px"><label>Order for</label><div class="sendrow seg">${['Floor','Office'].map(f=>`<button type="button" data-for="${f}" aria-pressed="${reqFor===f}">${f}</button>`).join('')}</div></div>
    ${EMAIL.test(to||'')?`<div class="to">Message goes to: <b>${esc(to)}</b>${st.deputyOn&&EMAIL.test(st.deputy)?' (deputy)':''}</div>`:'<div class="alert">No order contact has been set. Ask the stock manager to complete the settings.</div>'}
    <div class="sendrow"><button class="${st.channel!=='mail'?'pri':''}" data-act="send" data-via="teams" ${basket.length&&reqFor&&EMAIL.test(to||'')?'':'disabled'}>Send via Teams</button><button class="${st.channel==='mail'?'pri':''}" data-act="send" data-via="mail" ${basket.length&&reqFor&&EMAIL.test(to||'')?'':'disabled'}>Send by email</button></div>`;
  return `<div class="req"><section><div class="bar"><input type="search" id="rq" placeholder="Search items: name, number, location" value="${esc(rq)}" aria-label="Search items"></div>

/* Badges on the request list: is this item already requested / recently ordered, and for whom? */
function reqBadges(id){
  const m={};
  for(const l of orderLines()){if(l.item!==id)continue;const st=stOf(l);if(st==='received')continue;
    const k=st+(l.for||''),t=st==='ordered'?(l.orderedAt||l.at):l.at;const e=(m[k]??={st,for:l.for||'—',at:t});if(t>e.at)e.at=t}
  const v=Object.values(m).sort((a,b)=>a.st.localeCompare(b.st)||a.for.localeCompare(b.for));
  return v.length?`<div class="rb">${v.map(e=>`<span class="tag ${ST[e.st].c}">${ST[e.st].t} for ${esc(e.for)} · ${fdate(e.at)}</span>`).join('')}</div>`:'';
}
function recentReqs(){
  const from=S.settings.recentFrom||'';
  const rs=(S.requests||[]).filter(r=>r.at>from).slice(-8).reverse();if(!rs.length)return'';
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:24px"><h2 style="margin:0">Recent requests</h2><button data-act="clearrecent">Clear</button></div><div style="height:10px"></div><div class="list" style="max-height:none">${rs.map(r=>{const c={requested:0,ordered:0,received:0};r.lines.forEach(l=>c[stOf(l)]++);const n=r.lines.length;
    const sum=c.received===n?['Received','t-ok']:c.requested===0?['Ordered','t-count']:c.requested===n?['Requested','t-order']:[(n-c.requested)+' of '+n+' ordered','t-order'];
    return `<div class="li" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span><b>${fdate(r.at)}</b> · ${esc(r.for||'—')}${r.by?' · '+esc(r.by):''}</span><span class="tag ${sum[1]}">${sum[0]}</span></div>
      <div class="art" style="margin-top:4px">${r.lines.map(l=>esc(l.name)+({ordered:' (ordered)',received:' ✓'}[stOf(l)]||'')).join(' · ')}</div></div>`}).join('')}</div>`;
}
function buildText(){
  const lines=basket.map(b=>`- ${b.name}${b.art?' ['+b.art+']':''}`);
  return 'Please order the following consumables for '+(reqFor||'—')+':\n'+lines.join('\n')+(note.trim()?'\nNotes: '+note.trim():'');

async function send(via,o={}){
  const to=o.to||recipient(), text=buildText(), ch=o.channel||S.settings.channel;
  if(!o.test&&!sent){
    const items=Object.fromEntries(S.items.map(i=>[i.id,i]));
    const req={id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),at:new Date().toISOString(),by:ME,for:reqFor,note:note.trim(),
      lines:basket.map(b=>{const it=items[b.id]||{};return{item:b.id,name:b.name,art:b.art||'',unit:b.unit||'',supplier:it.supplier||'',link:it.link||'',status:'requested'}})};
    const ok=await mutate(s=>{s.requests=[...(s.requests||[]),req]},null);
    if(!ok){toast('Could not save the request in the app — check the network drive.',6000);return}
    /* wait (max 4 s) so opening Outlook/Teams cannot cut off the notification call */
    await Promise.race([notifyNewRequest(req),new Promise(r=>setTimeout(r,4000))]);
  }
  let url;
  if(via==='mail'){const subj='Consumables order ('+(reqFor||'—')+'): '+basket.map(b=>b.name.replace(/\s*\(.*\)$/,'')).slice(0,3).join(', ')+(basket.length>3?'…':'');
    url='mailto:'+to+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(text.replace(/\n/g,'\r\n'))}
  else{const base=ch==='teamsweb'?'https://teams.microsoft.com/l/chat/0/0':'msteams:/l/chat/0/0';
    url=base+'?users='+encodeURIComponent(to).replace('%40','@')+'&message='+encodeURIComponent(text)}
  try{const r=await fetch('/api/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});if(!r.ok)throw 0;if(o.test)return true;sent={via};render()}
  catch(e){try{await navigator.clipboard.writeText(text);toast('Could not open the app — the text was copied, paste it manually.',6000)}catch(_){toast('Could not open the app.')}}
}

    const wn=$('#f-wn').value.trim();if(wn&&!/^\d{1,3}$/.test(wn)){toast('Waiting time: enter a whole number');$('#f-wn').focus();return}
    o.wait=wn&&+wn>0?{n:+wn,u:$('#f-wu').value}:null;
    const oq=$('#f-oq').value.trim(),oqn=oq===''?null:num(oq);if(oq!==''&&(isNaN(oqn)||oqn<=0)){toast('Usual order quantity: enter a number');$('#f-oq').focus();return}o.ordQty=oqn;
    const nid=id||'i'+Date.now().toString(36);closeDlg();
    mutate(s=>{const cur=s.items.find(x=>x.id===nid);const base=cur||{id:nid,counted:null};const m={...base,...o};if(!m.wait)delete m.wait;if(m.ordQty==null)delete m.ordQty;if(o.stock!=null&&(!cur||o.stock!==cur.stock))m.counted=today();s.items=cur?s.items.map(x=>x.id===nid?m:x):[...s.items,m]},'Item saved')};
}
function closeDlg(){$('#dlg').hidden=true;$('#dlg').innerHTML=''}
function confirmDel(id){const it=S.items.find(x=>x.id===id);
  $('#dlg').innerHTML=`<div class="card"><h2>Delete “${esc(it.name)}”?</h2><p>The item will be removed from the list. Count history is kept.</p><div class="acts"><button data-act="close">Cancel</button><button class="pri" data-act="delok" data-id="${id}">Delete</button></div></div>`}
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('magazyn:'+t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function pinDlg(setNew){
  $('#dlg').innerHTML=`<form class="card" id="pf" style="width:min(420px,100%)"><h2>${setNew?'Set stock PIN':'Enter PIN'}</h2>
   <input class="pin" id="p1" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN">
   ${setNew?'<p class="small">At least 4 digits. Repeat:</p><input class="pin" id="p2" type="password" inputmode="numeric" autocomplete="off" aria-label="Repeat PIN">':''}
   <div class="acts"><button type="button" data-act="close">Cancel</button><button class="pri" type="submit">${setNew?'Save PIN':'Open'}</button></div></form>`;
  $('#dlg').hidden=false;$('#p1').focus();
  $('#pf').onsubmit=async e=>{e.preventDefault();const p=$('#p1').value.trim();
    if(setNew){if(!/^\d{4,}$/.test(p)){toast('PIN: at least 4 digits');return}if(p!==$('#p2').value.trim()){toast('PINs do not match');return}
      const h=await sha(p);closeDlg();if(await mutate(s=>{s.settings.pinHash=h},'PIN saved')){unlocked=true;mode='mag';render()}}
    else{if(await sha(p)===S.settings.pinHash){closeDlg();unlocked=true;mode='mag';render()}else{toast('Wrong PIN');$('#p1').value='';$('#p1').focus()}}};
}

/* ---------- actions ---------- */
async function openUrl(url){try{const r=await fetch('/api/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});if(!r.ok)throw 0}catch(e){window.open(url,'_blank')}}
function saveSettings(){
  const rec=$('#s-rec').value.trim(),dep=$('#s-dep').value.trim(),onEl=$('#s-depon'),ch=(document.querySelector('input[name=ch]:checked')||{}).value||'teams';
  if(rec&&!EMAIL.test(rec)){toast('Check the order contact email — not saved');return}
  if(dep&&!EMAIL.test(dep)){toast('Check the deputy email — not saved');return}
  if(onEl.checked&&!dep){onEl.checked=false;toast('Enter a deputy email first');return}
  const st=S.settings;if(rec===st.recipient&&dep===st.deputy&&onEl.checked===st.deputyOn&&ch===st.channel)return;
  mutate(s=>Object.assign(s.settings,{recipient:rec,deputy:dep,deputyOn:onEl.checked,channel:ch}),'Settings saved');
}
function commit(){
  const bad=Object.entries(draft).filter(([,v])=>{const n=num(v);return n==null||isNaN(n)});
  if(bad.length){toast('Fix invalid or empty entries ('+bad.length+') before saving.');return}
  const d={...draft},at=new Date().toISOString(),day=today();
  mutate(s=>{const lines=[];s.items=s.items.map(i=>{if(!(i.id in d))return i;const n=num(d[i.id]);lines.push({id:i.id,name:i.name,prev:i.stock,now:n});return{...i,stock:n,counted:day}});
    s.history=[...(s.history||[]),{at,lines}].slice(-200)},'Stock count saved: '+Object.keys(d).length+(Object.keys(d).length===1?' item':' items')).then(ok=>{if(ok){draft={};lsSet('draft',null);render()}});
}
function csv(){
  const h=['Material','Article number','Physical stock','Unit','Status','Supplier','Link','Location','Last count'];
  const c=v=>{const s=v==null?'':typeof v==='number'?String(v).replace('.',','):String(v);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  return '﻿'+[h,...S.items.map(i=>{const k=calc(i,i.stock);return[i.name,i.art,i.stock,i.unit,k.t,i.supplier,i.link,i.loc,i.counted||'']})].map(r=>r.map(c).join(';')).join('\r\n');
}
async function saveFile(name,text,type){
  if(window.__saveFile){try{await window.__saveFile(name,text);return true}catch(e){toast('Download not available here');return false}}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return true}
function download(){saveFile('consumables_'+today()+'.csv',csv(),'text/csv;charset=utf-8')}
function backup(){saveFile('consumables_backup_'+today()+'.json',JSON.stringify(S,null,1),'application/json').then(ok=>ok&&toast('Backup downloaded'))}
function restoreDlg(b,fname){
  $('#dlg').innerHTML=`<div class="card"><h2>Restore this backup?</h2><p><b>${esc(fname)}</b><br>${b.items.length} items${b.savedAt?', saved '+esc(new Date(b.savedAt).toLocaleString('en-GB')):''}.</p><p>All items, stock levels, history and requests in the app will be replaced by this file. Settings and PIN are taken from the file only where it has them; otherwise your current ones are kept.</p><div class="acts"><button data-act="close">Cancel</button><button class="pri" data-act="restoreok">Replace with backup</button></div></div>`;
  $('#dlg').hidden=false;restoreDlg.data=b}
function askDlg(title,text,okLabel,act){
  $('#dlg').innerHTML=`<div class="card"><h2>${title}</h2><p>${text}</p><div class="acts"><button data-act="close">Cancel</button><button class="pri" data-act="${act}">${okLabel}</button></div></div>`;
  $('#dlg').hidden=false}
function addToBasket(it){basket.push(it);lsSet('basket',basket);sent=null;render()}

const tipEl=document.createElement('div');tipEl.id='tip';tipEl.hidden=true;document.body.appendChild(tipEl);
const showTip=(el,x,y)=>{tipEl.textContent=el.dataset.tip;tipEl.hidden=false;const w=tipEl.offsetWidth;tipEl.style.left=Math.min(x+14,innerWidth-w-8)+'px';tipEl.style.top=(y+16)+'px'};
document.addEventListener('mousemove',e=>{const w=e.target.closest&&e.target.closest('.wait');if(w)showTip(w,e.clientX,e.clientY);else tipEl.hidden=true});
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('wait')){const r=e.target.getBoundingClientRect();showTip(e.target,r.right,r.top)}});
document.addEventListener('focusout',()=>{tipEl.hidden=true});
document.addEventListener('click',e=>{const w=e.target.closest&&e.target.closest('.wait');if(w&&matchMedia('(hover: none)').matches)toast(w.dataset.tip,3000)},true);
document.addEventListener('scroll',()=>{tipEl.hidden=true},true);
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a,[data-act],[data-sort]');if(!t)return;
  if(t.dataset.sort){const k=t.dataset.sort;if(sortBy===k)sortDir=-sortDir;else{sortBy=k;sortDir=1}render();return}
  if(t.dataset.url){if(window.__TEST__)return;e.preventDefault();openUrl(t.dataset.url);return}
  if(t.dataset.mode){if(t.dataset.mode==='mag'&&!unlocked){pinDlg(!S.settings.pinHash);return}mode=t.dataset.mode;render();return}
  if(t.dataset.tab){tab=t.dataset.tab;render();return}
  if(t.dataset.edit){openEdit(t.dataset.edit);return}
  if(t.dataset.selsup!=null){const g=t.dataset.selsup,ks=orderLines().filter(l=>(l.supplier||'Not on the list')===g&&stOf(l)!=='received'&&(ordFilt==='all'||ordFilt==='open'||stOf(l)===ordFilt)).map(l=>l.key);const all=ks.every(k=>sel.has(k));ks.forEach(k=>all?sel.delete(k):sel.add(k));render();return}
  if(t.dataset.undo){const k=t.dataset.undo;setLines([k],l=>{if(l.status==='received'){l.status='ordered';delete l.receivedAt;delete l.receivedBy}else{l.status='requested';delete l.orderedAt;delete l.orderedBy}},'Status set one step back');return}
  if(t.dataset.for){reqFor=t.dataset.for;lsSet('reqFor',reqFor);render();return}
  if(t.dataset.add){const i=S.items.find(x=>x.id===t.dataset.add);addToBasket({id:i.id,name:i.name,art:i.art,unit:i.unit,qty:''});return}
  if(t.dataset.brm){basket.splice(+t.dataset.brm,1);lsSet('basket',basket);render();return}
  const a=t.dataset.act;
  if(a==='new')openEdit(null);
  else if(a==='close')closeDlg();
  else if(a==='lock'){unlocked=false;mode='req';render()}
  else if(a==='del')confirmDel(t.dataset.id);
  else if(a==='delok'){const id=t.dataset.id;closeDlg();delete draft[id];lsSet('draft',draft);mutate(s=>{s.items=s.items.filter(x=>x.id!==id)},'Item deleted')}
  else if(a==='discard'){draft={};lsSet('draft',null);render()}
  else if(a==='commit')commit();
  else if(a==='markord'||a==='markrec'){const from=a==='markord'?'requested':'ordered',to=a==='markord'?'ordered':'received',ks=orderLines().filter(l=>sel.has(l.key)&&stOf(l)===from).map(l=>l.key),now=new Date().toISOString();
    const dq=Object.fromEntries(S.items.map(i=>[i.id,i.ordQty]));
    setLines(ks,l=>{l.status=to;l[to+'At']=now;l[to+'By']=ME;if(to==='ordered'&&l.qty==null&&dq[l.item]!=null)l.qty=dq[l.item]},ks.length+(ks.length===1?' item':' items')+' marked as '+to).then(ok=>{if(ok){ks.forEach(k=>sel.delete(k));render()}})}
  else if(a==='export')download();
  else if(a==='backup')backup();
  else if(a==='gobasket'){e.preventDefault();$('#basket').scrollIntoView({behavior:'smooth',block:'start'})}
  else if(a==='pushon'){t.disabled=true;t.textContent='Turning on…';window.__omPush().then(p=>p.enable(['requests'],'')).then(()=>{toast('Notifications are on for this device');fillPush()}).catch(e=>{const m=String(e&&e.message||e);toast(m==='blocked'?'Notifications are blocked — allow them in the browser/phone settings.':m==='dismissed'?'Notifications were not allowed.':'Could not turn on notifications: '+m,6000);fillPush()})}
  else if(a==='pushoff'){window.__omPush().then(p=>p.disable()).then(()=>{toast('Notifications are off for this device');fillPush()}).catch(()=>toast('Could not turn off'))}
  else if(a==='pushtest'){window.__omPush().then(p=>p.notify('requests','Test notification','If you see this, notifications work.','./',true)).then(r=>toast(r&&r.sent!=null?'Sent to '+r.sent+' device'+(r.sent===1?'':'s'):'Could not reach the notification service',6000))}
  else if(a==='signout'){if(window.__omSignOut)window.__omSignOut().then(()=>location.reload())}
  else if(a==='clearhist')askDlg('Clear stock count history?','All saved stock counts in History will be removed for everyone. Current stock levels stay as they are.','Clear history','clearhistok');
  else if(a==='clearhistok'){closeDlg();mutate(s=>{s.history=[]},'History cleared').then(ok=>ok&&render())}
  else if(a==='clearrecent')askDlg('Clear recent requests?','The list of recent requests will be emptied for everyone. Orders that are still open stay in the Orders tab and keep their badges.','Clear list','clearrecentok');
  else if(a==='clearrecentok'){closeDlg();mutate(s=>{s.settings.recentFrom=new Date().toISOString()},'Recent requests cleared').then(ok=>ok&&render())}
  else if(a==='sortdir'){sortDir=-sortDir;render()}
  else if(a==='restoreok'){const b=restoreDlg.data;closeDlg();mutate(s=>{const keep=s.settings||{};for(const k of Object.keys(s))delete s[k];Object.assign(s,defaults(clone(b)));/* settings the file leaves empty (PIN, contacts) keep their current values */const bs=b.settings||{};for(const[k,v]of Object.entries(keep))if(!(k in bs)||bs[k]===''||bs[k]==null)s.settings[k]=v},'Data restored').then(ok=>{if(ok){draft={};lsSet('draft',null);render()}})}
  else if(a==='addother'){const v=$('#other').value.trim();if(!v){$('#other').focus();return}addToBasket({id:null,name:v,art:'',unit:'',qty:''})}
  else if(a==='send')send(t.dataset.via);
  else if(a==='newreq'){basket=[];note='';sent=null;lsSet('basket',null);render()}
  else if(a==='setpin')pinDlg(true);
  else if(a==='testmsg'){/* test uses what is on screen now, saved or not */
    const st=S.settings,rec=($('#s-rec')||{}).value?.trim()??st.recipient,dep=($('#s-dep')||{}).value?.trim()??st.deputy,on=$('#s-depon')?$('#s-depon').checked:st.deputyOn,ch=(document.querySelector('input[name=ch]:checked')||{}).value||st.channel;
    const to=on&&EMAIL.test(dep)?dep:rec;if(!EMAIL.test(to||'')){toast('Enter a valid recipient email first');return}
    const keep=[basket,note];basket=[{id:null,name:'TEST — test message from the stock app',art:'',unit:'',qty:''}];note='';
    send(ch==='mail'?'mail':'teams',{to,channel:ch,test:true}).then(ok=>{[basket,note]=keep;if(ok)toast((ch==='mail'?'Outlook':'Teams')+' test message opened',4000)})}
  else if(a==='copyorder'){const l=S.items.map(i=>({i,c:calc(i)})).filter(x=>x.c.k==='out');const txt=l.map(({i})=>`${i.supplier}\t${i.name}\t${i.art}`).join('\n');navigator.clipboard.writeText(txt).then(()=>toast('Copied '+l.length+(l.length===1?' item':' items')),()=>toast('Copying blocked'))}
});
/* Clicking beside a dialog closes it — unless you were typing in it: then the click only ends the typing. */
const typingInDlg=()=>{const a=document.activeElement;return !!a&&$('#dlg').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)};
let dlgTyping=false,downOnBackdrop=false;
/* close only when the click both starts and ends outside the window (a drag that ends outside does not count) */
$('#dlg').addEventListener('pointerdown',e=>{downOnBackdrop=e.target.id==='dlg';dlgTyping=downOnBackdrop&&typingInDlg()});
$('#dlg').addEventListener('click',e=>{if(e.target.id!=='dlg'||!downOnBackdrop)return;downOnBackdrop=false;if(dlgTyping){dlgTyping=false;document.activeElement.blur();return}closeDlg()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#dlg').hidden){if(typingInDlg())document.activeElement.blur();else closeDlg();return}
  if(e.key==='Enter'&&e.target.closest&&e.target.closest('#ef')&&e.target.tagName==='INPUT'){e.preventDefault();e.target.blur();return}
  if(e.key==='Enter'&&e.target.classList.contains('cnt')){e.preventDefault();const all=[...document.querySelectorAll('.cnt')],i=all.indexOf(e.target);const nx=all[i+1]||e.target;nx.focus();nx.select();nx.scrollIntoView({block:'center',behavior:'smooth'})}
  if(e.key==='Enter'&&e.target.id==='other'){e.preventDefault();document.querySelector('[data-act=addother]').click()}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q'){q=t.value;render()}
  if(t.id==='rq'){rq=t.value;render()}
  if(t.id==='note'){note=t.value}
  if(t.dataset.bq!=null){basket[+t.dataset.bq].qty=t.value;lsSet('basket',basket)}
  if(t.classList.contains('cnt')){const id=t.dataset.id;if(t.value.trim()==='')delete draft[id];else draft[id]=t.value;lsSet('draft',draft);live(id)}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='restore-file'){const f=t.files&&t.files[0];t.value='';if(!f)return;f.text().then(txt=>{let b;try{b=JSON.parse(txt)}catch(e){toast('This is not a valid backup file');return}if(!b||!Array.isArray(b.items)||!b.items.length||!b.items.every(i=>i&&i.id&&i.name)){toast('This file does not contain app data');return}restoreDlg(b,f.name)});return}
  if(['s-rec','s-dep','s-depon'].includes(t.id)||t.name==='ch'){saveSettings();return}
  if(t.dataset.sel){t.checked?sel.add(t.dataset.sel):sel.delete(t.dataset.sel);render();return}
  if(t.classList.contains('oqty')){const v=t.value.trim(),n=v===''?null:num(v);if(v!==''&&(isNaN(n)||n<0)){toast('Quantity: enter a number');return}setLines([t.dataset.qkey],l=>{if(n==null)delete l.qty;else l.qty=n},null);return}
  if(t.id==='ordfilt'){ordFilt=t.value;sel.clear();render();return}
  if(t.id==='filt'){filt=t.value;render()}
  if(t.id==='sort'){sortBy=t.value;render()}
});

fetch('/api/whoami').then(r=>r.json()).then(j=>{ME=j.user||''}).catch(()=>{});
load().then(()=>render());
addEventListener('om-remote',()=>load(true));   /* web version: another device saved */
addEventListener('pagehide',()=>{if(!window.__TEST__)try{navigator.sendBeacon('/api/bye','{}')}catch(e){}});
setInterval(()=>{if($('#dlg').hidden)load(true);else fetch('/api/ping').catch(()=>{})},20000);
}
